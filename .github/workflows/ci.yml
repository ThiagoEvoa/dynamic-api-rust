# CI: enforce the quality gates documented in README.md on every push and PR.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Pin the most-privileged jobs to the minimal set of permissions.
permissions:
  contents: read

jobs:
  # fmt / clippy / test — the three commands in the README "Quality gates" section.
  check:
    name: fmt · clippy · test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Match the toolchain the Dockerfile would use as closely as possible:
      # a recent stable with the clippy + rustfmt components.
      - name: Install Rust toolchain (stable, clippy + rustfmt)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache Cargo/registry
        uses: swatinem/rust-cache@v2

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: cargo test
        run: cargo test --workspace

  # Build the Docker image end-to-end (no push) to catch build-stage drift.
  docker:
    name: docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU (for cross-arch images, if built on non-amd64)
        uses: docker/setup-qemu-action@v3

      - name: Set up buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: dynamic-api-rust:ci
          # Base images are digest-pinned in the Dockerfile, so no --pull is
          # needed for reproducibility.
