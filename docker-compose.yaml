services:
  dynamic-api-rust:
    container_name: dynamic-api-rust-app
    build: .
    restart: always
    environment:
      - HOST=0.0.0.0
      - PORT=8080
    networks:
      - tunnel_net

  tunnel:
    container_name: cloudflare-tunnel
    # Digest-pinned for reproducible deploys. Re-bump to the freshly-pulled
    # `cloudflare/cloudflared@sha256:...` digest when you upgrade the tunnel;
    # see .github/workflows for the update routine.
    image: cloudflare/cloudflared@sha256:faa8e0a1475f137c910be6025f43c8e4092fdd35461b31e19fd1390657a1ff39
    restart: always
    # We add --no-autoupdate for stability on Raspberry Pi (matches the
    # dynamic_api_dart compose file).
    command: tunnel --no-autoupdate run
    environment:
      - TUNNEL_TOKEN=${TUNNEL_TOKEN}
    networks:
      - tunnel_net
    depends_on:
      - dynamic-api-rust

networks:
  tunnel_net:
    driver: bridge
